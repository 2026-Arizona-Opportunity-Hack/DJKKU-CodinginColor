name: Database tests

# Starts a real local Supabase (Postgres, Auth) from the migrations and seed, then runs
# supabase/tests/db.test.ts against it. Separate from ci.yml because it needs Docker and
# takes a couple of minutes. Read-only, no secrets: the keys below are the public demo
# keys every local Supabase uses.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: Migrations, seed and per-role tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (the version we test locally). "latest" asks the GitHub API which release is
          # newest, and that call is rate limited on shared runners, which failed the job twice.
          version: 3.1.0
      - name: Start local Supabase (only what the tests need)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,supavisor,postgres-meta
      - name: Apply migrations and seed from scratch
        run: supabase db reset
      - name: Run the database tests (a missing database is a failure here)
        run: npx vitest run supabase
        env:
          REQUIRE_DB: '1'
      - name: Stop
        if: always()
        run: supabase stop --no-backup
